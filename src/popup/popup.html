<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>__MSG_popup_title__</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header id="title">__MSG_popup_title__</header>

  <p id="status" role="status"></p>

  <ul id="files" hidden></ul>

  <footer id="footer" hidden>
    <button id="download_all" type="button">__MSG_popup_download_all__</button>
  </footer>

  <template id="file_template">
    <li class="file">
      <span class="details">
        <span class="name"></span>
        <span class="meta"></span>
      </span>
      <button class="download" type="button"></button>
    </li>
  </template>

  <script src="/scripts/i18n.js"></script>
  <script type="module" src="/popup/popup.js"></script>
</body>

</html>
